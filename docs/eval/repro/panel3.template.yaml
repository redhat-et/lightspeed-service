# Judge panel template — do not edit this file to point at your endpoint.
# Render it with render_config.py so the endpoint and key stay out of git.
#
# Every placeholder below is substituted from the environment (or judges.env).
# The endpoint and key reach the client through `environment:` below, because
# the harness reads OPENAI_API_BASE / OPENAI_API_KEY; api_base and api_key_path
# on a pool entry are accepted but not propagated.

core:
  max_threads: 1
  fail_on_invalid_data: true
  skip_on_failure: false
  cache_enabled: false

environment:
  OPENAI_API_BASE: "${JUDGE_API_BASE}"
  OPENAI_API_KEY: "${JUDGE_API_KEY}"

llm_pool:
  defaults:
    timeout: 1200
    num_retries: 3
    parameters:
      temperature: 0.0
  models:
    judge_1:
      description: "neutral judge, quoted in the published table"
      provider: openai
      model: "${JUDGE_1_MODEL}"
      parameters:
        max_completion_tokens: ${JUDGE_1_MAX_TOKENS}
    judge_2:
      description: "second family; thinking judge needs the larger output budget"
      provider: openai
      model: "${JUDGE_2_MODEL}"
      parameters:
        max_completion_tokens: ${JUDGE_2_MAX_TOKENS}
    judge_3:
      description: "third family; thinking judge"
      provider: openai
      model: "${JUDGE_3_MODEL}"
      parameters:
        max_completion_tokens: ${JUDGE_3_MAX_TOKENS}

judge_panel:
  judges:
    - judge_1
    - judge_2
    - judge_3
  enabled_metrics:
    - "custom:answer_correctness"
  aggregation_strategy: average

metrics_metadata:
  turn_level:
    "custom:answer_correctness":
      # Must stay explicit: with no threshold the harness falls back to 0.5 and
      # inflates pass counts by roughly 20 questions on 100. 0.75 is the bar
      # every published number in this campaign uses.
      threshold: 0.75
      description: "Correctness vs expected answer using custom LLM evaluation"
      default: true

agents:
  enabled: true
  default:
    agent: [ols_ask]
  agents:
    ols_ask:
      type: http_api
      api_base: "${APP_API_BASE}"
      version: v1
      endpoint_type: query
      timeout: 1800
      provider: "${APP_PROVIDER}"
      model: "${APP_MODEL}"
      cache_enabled: false
      extra_request_params:
        mode: ask
